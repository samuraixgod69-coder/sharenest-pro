<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ShareNest Pro — Global Cloud Sync</title>
<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#060714;--text:#f7f8ff;--muted:#8d91ad;--muted2:#777b99;--card:#17182f;--tile:#1b1c3abc;--tile-h:#27284e;--input:#24244b;--input-b:#3a3b61;--line:#ffffff14;--line2:#4b4d78;--soft:#ffffff14;--thumb:#29294a;--accent:#8e8dff;--side:#08091db3;--pop:#171832;--pop-b:#484975;--hero:linear-gradient(110deg,#39367085,#2c275b59);--app:radial-gradient(circle at 55% 5%,#25204f 0,#0d0f28 34%,#040510 75%);--sideact:linear-gradient(145deg,#31356c,#20234c);--overlay:#0009;--pageview:rgba(3,5,18,.97);--danger:#ff6b81}
body.light{color-scheme:light;--bg:#eef1ff;--text:#17182f;--muted:#5d6180;--muted2:#6b6f8f;--card:#fff;--tile:#ffffffcc;--tile-h:#f3f4ff;--input:#fff;--input-b:#c9cdf0;--line:#17182f1a;--line2:#c3c7ea;--soft:#17182f0d;--thumb:#e3e6fb;--accent:#5b52ff;--side:#ffffffe6;--pop:#fff;--pop-b:#c3c7ea;--hero:linear-gradient(110deg,#ffffffd9,#e6e9ffd9);--app:linear-gradient(135deg,#eef1ff,#fff);--sideact:linear-gradient(145deg,#dfe2ff,#cfd4ff);--overlay:#17182f66;--pageview:rgba(238,241,255,.98);--danger:#d6304a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:flex;min-height:100vh;background:var(--app)}
.sidebar{width:96px;position:fixed;left:0;top:0;bottom:0;border-right:1px solid var(--line);background:var(--side);backdrop-filter:blur(10px);padding:22px 14px;z-index:20;display:flex;flex-direction:column;align-items:center}
.brand{height:64px;width:64px;border-radius:20px;background:linear-gradient(145deg,#30345e,#171a3d);display:grid;place-items:center;font-size:31px;margin-bottom:28px}
.side{width:62px;height:62px;border:0;border-radius:20px;background:transparent;color:var(--muted);font-size:25px;margin:4px 0}
.side.active{background:var(--sideact);color:var(--text)}
.content{margin-left:96px;width:calc(100% - 96px);padding:42px 36px 70px}.top{max-width:1150px;margin:auto}
h1{font-size:42px;letter-spacing:-1.5px}.subtitle{color:var(--muted);margin-top:8px;font-size:17px}
.toolbar{display:flex;gap:12px;margin:30px 0;flex-wrap:wrap}
.upload,.primary{border:0;color:#fff;font-weight:700;padding:16px 22px;border-radius:17px;background:linear-gradient(135deg,#755cff,#4d8cff)}
.secondary{border:1px solid var(--line2);background:var(--input);color:var(--text);padding:14px 18px;border-radius:15px}
.search{flex:1;min-width:220px;border:1px solid var(--input-b);background:var(--input);color:var(--text);border-radius:18px;padding:17px 20px;outline:none}
.hero{border:1px solid var(--line);border-radius:32px;padding:34px 40px;background:var(--hero);margin-bottom:30px}
.hero h2{font-size:31px}.hero p{color:var(--muted);margin:10px 0 22px}
.stats{display:flex;gap:14px;flex-wrap:wrap}.stat{padding:13px 18px;border-radius:18px;background:var(--soft);color:var(--muted)}.stat b{color:var(--text)}
.files{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.file{background:var(--card);border:1px solid var(--line);border-radius:25px;overflow:hidden;position:relative}
.thumb{height:180px;background:var(--thumb);display:grid;place-items:center;font-size:65px;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.file-info{padding:18px}
.file-info h3{font-size:17px;word-break:break-word}
.file-info p{color:var(--muted2);margin-top:7px}
.file-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mini{border:1px solid var(--line2);background:var(--input);color:var(--text);padding:9px 11px;border-radius:11px;font-size:13px}
.empty{padding:40px;text-align:center;color:var(--muted2);grid-column:1/-1}
.modal{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.show{display:flex}
.box{width:min(550px,100%);max-height:90vh;overflow:auto;padding:28px;border-radius:25px;background:var(--pop);border:1px solid var(--pop-b)}
.form-input{width:100%;padding:15px;border-radius:14px;border:1px solid var(--pop-b);background:var(--input);color:var(--text);outline:none;margin:8px 0 14px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--pop);color:var(--text);border:1px solid var(--pop-b);padding:14px 18px;border-radius:14px;opacity:0;transition:.25s;z-index:80}
.toast.show{opacity:1}
@media(max-width:900px){.files{grid-template-columns:1fr}.sidebar{width:72px;padding:16px 8px}.content{margin-left:72px;width:calc(100% - 72px)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand">☁️</div>
<button class="side active">🌐</button>
</aside>
<main class="content"><div class="top">
<div><h1>ShareNest Cloud</h1><p class="subtitle">Global synchronized public shelf</p></div>
<div class="toolbar">
<button class="upload" onclick="openUpload()">☁️ Upload Files</button>
<input id="search" class="search" placeholder="⌕ Search cloud files..." oninput="render()">
</div>
<section class="hero">
<h2>Global Public Storage 🔐</h2>
<p>Files uploaded here sync instantly across all devices and visitors.</p>
<div class="stats"><div class="stat">📦 <b id="fileCount">0</b> Files Online</div></div>
</section>
<section id="files" class="files"></section>
</div></main></div>

<div id="uploadModal" class="modal"><div class="box">
<h2>☁️ Upload to Global Cloud</h2>
<input id="uploaderName" class="form-input" type="text" placeholder="Your Name (Optional)">
<input id="picker" class="form-input" type="file" multiple onchange="uploadFiles(this.files)">
<div id="uploadStatus" style="color:var(--accent);margin-top:10px"></div>
<button class="secondary" style="width:100%;margin-top:15px" onclick="closeUpload()">Close</button>
</div></div>

<div id="toast" class="toast"></div>

<script>
// --- SUPABASE CONFIGURATION ---
const SUPABASE_URL = 'https://lahnustwkknopcfbqwqp.supabase.co';[span_0](start_span)[span_0](end_span)
const SUPABASE_PUBLISHABLE_KEY = 'Sb_publishable_Q1dDN09bCcYaerXxefwbmA_6Icam4qe';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let files = [];

function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

async function fetchFiles(){
  const { data, error } = await supabase.from('files').select('*').order('created_at', { ascending: false });
  if(!error && data) {
    files = data;
    render();
  }
}

function render(){
  const q = $('search').value.toLowerCase();
  const filtered = files.filter(f => f.name.toLowerCase().includes(q));
  const box = $('files');
  
  if(!filtered.length){
    box.innerHTML = '<div class="empty">No files in cloud yet. Upload one!</div>';
  } else {
    box.innerHTML = filtered.map(f => `
      <article class="file">
        <div class="thumb">
          ${f.type && f.type.startsWith('image/') ? `<img src="${f.url}" alt="">` : '<span>📄</span>'}
        </div>
        <div class="file-info">
          <h3>${esc(f.name)}</h3>
          <p>By: <b>${esc(f.uploader || 'Anonymous')}</b></p>
          <div class="file-actions">
            <a class="mini" href="${f.url}" target="_blank" download style="text-decoration:none">⬇️ Download</a>
            <button class="mini" onclick="deleteFile('${f.id}', '${f.path}')">🗑️ Delete</button>
          </div>
        </div>
      </article>
    `).join('');
  }
  $('fileCount').textContent = files.length;
}

function openUpload(){ $('uploadModal').classList.add('show'); }
function closeUpload(){ $('uploadModal').classList.remove('show'); fetchFiles(); }

async function uploadFiles(fileList){
  const uploader = $('uploaderName').value.trim() || 'Anonymous';
  const status = $('uploadStatus');
  status.textContent = 'Uploading to cloud...';

  for(const file of fileList){
    const filePath = 'public/' + Date.now() + '_' + file.name;
    const { data: storageData, error: storageError } = await supabase.storage.from('sharenest-files').upload(filePath, file);
    
    if(storageError){
      status.textContent = '❌ Error: ' + storageError.message;
      return;
    }

    const { data: { publicUrl } } = supabase.storage.from('sharenest-files').getPublicUrl(filePath);

    await supabase.from('files').insert([{
      name: file.name,
      size: file.size,
      type: file.type,
      uploader: uploader,
      url: publicUrl,
      path: filePath
    }]);
  }

  status.textContent = '✅ Uploaded successfully!';
  toast('Files synced to cloud!');
  fetchFiles();
}

async function deleteFile(id, path){
  const pass = prompt('Enter Owner Passcode (SAMURAIXGOD698):');
  if(pass === 'SAMURAIXGOD698'){
    await supabase.storage.from('sharenest-files').remove([path]);
    await supabase.from('files').delete().eq('id', id);
    fetchFiles();
    toast('File deleted');
  } else if(pass !== null){
    alert('Incorrect passcode!');
  }
}

// Real-time listener for automatic sync across devices
supabase.channel('public:files')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'files' }, payload => {
    fetchFiles();
  })
  .subscribe();

fetchFiles();
</script>
</body>
</html>
